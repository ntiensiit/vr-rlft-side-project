[project]
name = "vr-rlft-side-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ntiensiit", email = "ntiensi.it@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=1.26.0",
    "matplotlib>=3.11.1",
    "mujoco>=3.11.0",
    "open3d>=0.19.0",
    "pytransform3d>=3.16.0",
    "scipy>=1.18.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "theseus>=0.0.5",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "wandb>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=6",
    "mypy>=1.13",
    "mujoco>=3.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

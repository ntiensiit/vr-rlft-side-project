[project]
name = "vr-rlft-side-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ntiensiit", email = "ntiensi.it@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=1.26.0",
    "matplotlib>=3.11.1",
    "mujoco>=3.11.0",
    "open3d>=0.19.0",
    "pytransform3d>=3.16.0",
    "pyyaml>=6.0.2",
    "scipy>=1.18.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "theseus>=0.0.5",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "wandb>=0.28.1",
    "hydra-core>=1.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.5.0",
    "mypy>=1.13",
    "mujoco>=3.11.0",
    "hypothesis>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grasping_ai"]

# Headless CI has no GPU. Official Linux torch wheels pull triton, and
# Optimizer.__init__ -> _disable_dynamo imports it and segfaults on runners.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff.lint.isort]
force-to-top = ["open3d"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: end-to-end / artifact-chain tests that exercise full pipelines and may take tens of seconds; skip with ``-m 'not slow'``",
]

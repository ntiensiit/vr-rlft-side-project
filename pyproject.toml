[project]
# Package layout preserves "src" directory structure.
name = "vr-rlft-side-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ntiensiit", email = "ntiensi.it@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=1.26.0",
    "matplotlib>=3.11.1",
    "mujoco>=3.11.0",
    "open3d>=0.19.0",
    "pytransform3d>=3.16.0",
    "pyyaml>=6.0.2",
    "scipy>=1.18.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "theseus>=0.0.5",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "wandb>=0.28.1",
    "hydra-core>=1.3.5",
    "loguru>=0.7.2",
    "mlflow>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.5.0",
    "mypy>=1.13",
    "mujoco>=3.11.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

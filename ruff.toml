    "INP001",
    "T201",
    "BLE001",
    "NPY002",
    "PTH",
]
"scripts/**/*.py" = [
    "PLR2004",
    "PLR0912",
    "PLR0913",
    "PLR0917",
    "PLC0415",
    "TRY003",
    "PLR0915",
    "INP001",
    "T201",
    "ANN",

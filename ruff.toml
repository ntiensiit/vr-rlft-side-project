target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", "build", "dist", "notebooks"]

[lint]
select = ["ALL"]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["grasping_ai", "scripts"]
force-to-top = ["open3d"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 libegl1 libglib2.0-0 libgomp1 xvfb
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy src
      - name: Verify package import
        run: xvfb-run -a uv run python -c "import grasping_ai; print('grasping_ai ok')"

  fast-tests:
    name: Fast tests and coverage
    needs: lint
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MUJOCO_GL: osmesa
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "1"
      TORCHDYNAMO_DISABLE: "1"
      TORCH_COMPILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 libegl1 libglib2.0-0 libgomp1 xvfb
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Pytest (excluding slow / artifact-chain tests)
        run: bash scripts/ci_pytest.sh

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 libegl1 libglib2.0-0 libgomp1 xvfb
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy src
      - name: Verify package import
        run: xvfb-run -a uv run python -c "import grasping_ai; print('grasping_ai ok')"

  pytest:
    name: Pytest ${{ matrix.test_file }}
    needs: lint
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MUJOCO_GL: osmesa
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "1"
      COVERAGE_FILE: .coverage.${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: grasp_io
            test_file: tests/test_grasp_io_runtime.py
          - id: phase1
            test_file: tests/test_phase1_foundation.py
          - id: phase2
            test_file: tests/test_phase2_sim_robotics.py
          - id: phase3
            test_file: tests/test_phase3_data_perception.py
          - id: phase4_flow
            test_file: tests/test_phase4_flow_training.py
          - id: phase4_gen
            test_file: tests/test_phase4_generative_grasp.py
          - id: phase5
            test_file: tests/test_phase5_rl_policy.py
          - id: phase6
            test_file: tests/test_phase6_orchestration.py
          - id: phase7
            test_file: tests/test_phase7_synthetic_data.py
          - id: phase8
            test_file: tests/test_phase8_tracking.py
          - id: phase9
            test_file: tests/test_phase9_gymnasium_env.py
          - id: phase10
            test_file: tests/test_phase10_evaluation.py
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 libegl1 libglib2.0-0 libgomp1 xvfb
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Run fast tests
        run: |
          set +e
          xvfb-run -a uv run coverage run --rcfile=coverage.toml -m pytest -q "${{ matrix.test_file }}" -m "not slow"
          rc=$?
          set -e
          if [ "$rc" -eq 139 ]; then
            echo "Ignoring teardown segfault (139) for ${{ matrix.test_file }}"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
      - name: Upload coverage fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.id }}
          path: .coverage.${{ matrix.id }}

  coverage:
    name: Coverage gate
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Download coverage fragments
        uses: actions/download-artifact@v4
        with:
          path: coverage-data
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report coverage
        run: |
          mapfile -t fragments < <(find coverage-data -name '.coverage.*' -type f)
          if ((${#fragments[@]} == 0)); then
            echo "No coverage fragments found under coverage-data:" >&2
            find coverage-data -print >&2 || true
            exit 1
          fi
          export COVERAGE_FILE=.coverage
          uv run coverage combine "${fragments[@]}"
          uv run coverage report --rcfile=coverage.toml --fail-under=80

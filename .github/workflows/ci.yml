name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  NODE_OPTIONS: "--no-deprecation"
  UV_LINK_MODE: "copy"

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "uv.lock"
      - name: Cache uv store
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Remove triton (segfaults on headless Linux via torch.optim)
        run: uv pip uninstall -y triton || true
      - name: Ruff
        run: uv run --frozen ruff check src tests scripts
      - name: Mypy
        run: uv run --frozen mypy src
      - name: Verify package import
        run: uv run --frozen python -c "import grasping_ai; print('grasping_ai ok')"

  fast-tests:
    name: Fast tests and coverage
    needs: lint
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MUJOCO_GL: osmesa
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 libegl1 libglib2.0-0 libgomp1 xvfb
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "uv.lock"
      - name: Cache uv store
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Cache pytest
        uses: actions/cache@v6
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            pytest-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Remove triton (segfaults on headless Linux via torch.optim)
        # Linux torch wheels depend on triton; Adam -> _disable_dynamo imports it
        # and segfaults on CPU-only runners. Local Windows uses torch+cpu (no triton).
        run: uv pip uninstall -y triton || true
      - name: Pytest (excluding slow / artifact-chain tests)
        run: >
          xvfb-run -a uv run --frozen pytest -n auto -q -m "not slow"
          --cov=src/grasping_ai --cov-config=coverage.toml
          --cov-report=term-missing --cov-fail-under=80

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  fast:
    name: Lint, typecheck, and fast tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MUJOCO_GL: osmesa
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 libegl1 libglib2.0-0 libgomp1 xvfb
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy src
      - name: Verify package import
        run: xvfb-run -a uv run python -c "import grasping_ai; print('grasping_ai ok')"
      - name: Pytest (excluding slow / artifact-chain tests)
        run: |
          set +e
          xvfb-run -a uv run coverage run --rcfile=coverage.toml -m pytest -q -m "not slow" 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -qE 'FAILED|ERROR' pytest.log; then
            exit "${rc:-1}"
          fi
          if ! grep -qE '[0-9]+ passed' pytest.log; then
            echo "Pytest did not report passing tests"
            cat pytest.log
            exit "${rc:-1}"
          fi
          if [ "$rc" -eq 139 ]; then
            echo "Ignoring headless teardown segfault (exit 139) after tests passed"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          uv run coverage report --rcfile=coverage.toml --fail-under=80
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  fast:
    name: Lint, typecheck, and fast tests
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
      LIBGL_ALWAYS_SOFTWARE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 libglib2.0-0 libgomp1 xvfb
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy src
      - name: Verify Open3D import
        run: xvfb-run -a uv run python -c "import open3d; print('open3d ok')"
      - name: Verify MuJoCo import
        run: uv run python -c "import mujoco; print('mujoco ok')"
      - name: Verify package import
        run: uv run python -c "import grasping_ai; print('grasping_ai ok')"
      - name: Pytest (excluding slow / artifact-chain tests)
        run: xvfb-run -a uv run pytest -q -m "not slow" --cov=src/grasping_ai --cov-fail-under=80
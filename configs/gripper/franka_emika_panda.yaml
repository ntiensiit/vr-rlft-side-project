# @package _global_
robot:
  description: deploy/robot.xml
  gripper:
    description: ${robot.description}
    dual_count: 2
    max_width: 0.08
    min_width_clamp: 0.003
    # Maximum object extent from the contact midpoint back toward the palm
    # for a collision-free top-down grasp.
    max_object_extent_toward_hand: 0.04
    close_command:
      - 0.0
    open_command:
      - 0.04
    joint_ranges:
      finger_joint1: [0.0, 0.04]
      finger_joint2: [0.0, 0.04]
    base_to_contact:
      position: [0, 0, 0.1029]
      quaternion_wxyz: [0.707106781, 0.0, 0.0, 0.707106781]
  ik:
    max_iterations: 400
    tolerance: 0.001
    damping: 0.01

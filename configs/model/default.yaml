# @package _global_
default_method: diffusion
grasp:
  dim: 9
  representation: 6d_rotation_columns
architecture:
  feature_dim: 32
  hidden_dim: 32
  num_layers: 2
  num_grasps: 8
diffusion:
  train_steps: 100
  inference_steps: 5
  checkpoint: artifacts/checkpoints/diffusion_grasp_generator.pt
  tensorboard: artifacts/exports/tensorboard/diffusion_train
  exports:
    grasp_candidates: artifacts/exports/diffusion_grasp_candidates_by_object.npy
    grasp_poses: artifacts/exports/diffusion_grasp_poses_003_cracker_box.npy
    simulation_report: artifacts/reports/diffusion_simulation_outcomes_003_cracker_box.jsonl
    evaluation_report: artifacts/reports/diffusion_analytical_evaluation_report.jsonl
  beta_start: 1.0e-4
  beta_end: 0.02
  num_steps: 100
flow:
  train_steps: 100
  inference_steps: 5
  checkpoint: artifacts/checkpoints/flow_grasp_generator.pt
  tensorboard: artifacts/exports/tensorboard/flow_train
rl:
  observation_dim: 31
  action_dim: 8
  hidden_dim: 32
  checkpoint: artifacts/checkpoints/rl_grasp_policy.pt
  tensorboard: artifacts/exports/tensorboard/rl_grasp_train

# @package _global_
defaults:
  - grasp

default_method: flow
architecture:
  feature_dim: 64
  hidden_dim: 64
  num_layers: 3
  num_grasps: 8
flow:
  inference_steps: 10
  checkpoint: ${artifacts.checkpoints}/flow_grasp_generator.pt
  tensorboard: ${artifacts.tensorboard}/flow_train
  exports:
    grasp_poses: ${artifacts.exports}/flow_grasp_poses_${objects.ids.0}.npy
    simulation_report: ${artifacts.reports}/flow_simulation_outcomes_${objects.ids.0}.jsonl
    evaluation_report: ${artifacts.reports}/flow_analytical_evaluation_report.jsonl

model:
  checkpoint: ${flow.checkpoint}
  inference_steps: ${flow.inference_steps}
  exports:
    grasp_poses: ${flow.exports.grasp_poses}
    simulation_report: ${flow.exports.simulation_report}
    evaluation_report: ${flow.exports.evaluation_report}
    inference_candidates: ${artifacts.exports}/grasp_candidates.npy

# @package _global_
seed: 42
device: cpu
experiment_name: default
output_dir: artifacts
array_dtype: float32
sim_dtype: float64
paths:
  output_dir: ${output_dir}
tracking:
  backend: none
  project: vr-rlft-side-project
  entity: null
  mode: offline
  mlflow:
    tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,"./mlruns"}
    experiment_name: ${experiment_name}
logging:
  rotation: 10 MB
  retention: 10 days

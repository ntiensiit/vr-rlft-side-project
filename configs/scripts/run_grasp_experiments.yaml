# @package _global_
defaults:
  - /scripts/base
  - /scripts/sim_env
  - _self_

script:
  grasp_file: data/processed/003_cracker_box.npz
  object_id: 003_cracker_box
  grasp_index: 0
  policy_checkpoint: ${rl.checkpoint}
  output: ${artifacts.reports}/003_grasp_experiments.jsonl
  episodes: 20
  max_steps: 500
  baseline_simulation_steps: 2000
  lift_threshold: ${metrics.lift_height_threshold}
  pregrasp_distance: ${rl.pregrasp_distance}
  robot_xml: ${robot.description}
  ycb_root: ${paths.ycb_mjcf}
  table_xml: ${table_xml}

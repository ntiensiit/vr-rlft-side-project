# @package _global_
paths:
  input_dir: ${oc.env:MGS_INPUT_DIR,"data"}
  ycb_mjcf: ${paths.input_dir}/processed/ycb_mjcf
  observations: ${paths.input_dir}/observations
  dataset_root: ${paths.input_dir}/processed
  ycb_root: ${paths.input_dir}/raw/ycb
  output_index: ${paths.input_dir}/processed/index.json

synthetic:
  num_samples: 512
  num_grasps: 16
  gripper_width: ${robot.gripper.max_width}
  seed: 42
  oversample_factor: 2
  oversample_extra: 256
  neighborhood_size: 30
  voxel_size: 1.0e-5
  strict_antipodal_dot: 0.5
  strict_alignment_dot: 0.5
  relaxed_antipodal_dot: 0.3
  allow_relaxed: true
  search_multiplier: 50
  candidate_multiplier: 3
  min_grasp_translation: 0.01
  min_grasp_rotation: 0.2
  min_quality_score: 0.001
  friction_coefficient: ${metrics.friction_coefficient}
  collision_clearance: ${metrics.collision_clearance}
  sim_validate: false
  sim_validate_require_lift: true
  sim_validate_require_ik: true
  sim_validate_min_contacts: 1.0
  sim_validate_fallback_analytical: true
  sim_table_xml: ${table_xml}
  lift_height_threshold: ${metrics.lift_height_threshold}
  lift_distance: 0.1
  max_linear_velocity: ${limits.max_linear_velocity}
  max_angular_velocity: ${limits.max_angular_velocity}
  sim_object_position:
    - 0.5
    - 0.0
    - 0.28
  # 0.1 s pre-grasp + 0.5 s close + up to 1.0 s contact acquisition,
  # 0.2 s contact confirmation + 1.0 s lift + at least 1.2 s stability hold.
  num_simulation_steps: 2000
geometry:
  point_cloud_ndim: 2
  spatial_dim: 3
  min_normal_neighborhood: 3
tolerances:
  norm_eps: 1.0e-8
  degenerate_span_eps: 1.0e-12
  degenerate_component_eps: 1.0e-9
  grasp_distance_eps: 1.0e-4
  rotation_det_eps: 1.0e-4
  alignment_dot_threshold: 0.9
observations:
  num_samples: 256
  seed: 7
  gripper_point_cloud: ${paths.observations}/gripper.npy
  output:
    merged_objects: merged_objects.npy
    merged_objects_normalized: merged_objects_normalized.npy
    gripper: gripper.npy
  gripper_grid:
    x:
      start: -0.03
      stop: 0.03
      count: 4
    y:
      start: -0.02
      stop: 0.02
      count: 3
    z:
      start: -0.04
      stop: 0.04
      count: 5
  files:
    - ${paths.observations}/${objects.ids.0}.npy
    - ${paths.observations}/${objects.ids.1}.npy
    - ${paths.observations}/${objects.ids.2}.npy


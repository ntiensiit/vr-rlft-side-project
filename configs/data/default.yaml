# @package _global_
paths:
  dataset_root: data/processed
  ycb_root: data/raw/ycb
  output_index: data/processed/index.json

splits:
  train: train
  val: val
  test: test
synthetic:
  num_samples: 512
  num_grasps: 16
  gripper_width: 0.08
  seed: 42
  oversample_factor: 2
  oversample_extra: 256
  neighborhood_size: 30
  voxel_size: 1.0e-5
  strict_antipodal_dot: 0.5
  strict_alignment_dot: 0.5
  relaxed_antipodal_dot: 0.3
  allow_relaxed: true
  search_multiplier: 50
  candidate_multiplier: 3
  min_grasp_translation: 0.01
  min_grasp_rotation: 0.2
  min_quality_score: 0.0
  friction_coefficient: 0.5
  collision_clearance: 0.005
  sim_validate: false
  sim_validate_require_lift: false
  sim_validate_require_ik: true
  sim_validate_min_contacts: 1.0
  sim_validate_fallback_analytical: true
  sim_table_xml: deploy/table.xml
  sim_object_position:
    - 0.5
    - 0.0
    - 0.1
observations:
  num_samples: 256
  seed: 7

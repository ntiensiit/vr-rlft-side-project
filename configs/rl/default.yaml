# @package _global_
rl:
  verbose: 1
  observation_dim: 39
  action_dim: 8
  hidden_dim: 32
  checkpoint: ${artifacts.checkpoints}/rl_grasp_policy.pt
  tensorboard: ${artifacts.tensorboard}/rl_grasp_train
  learning_rate: 0.0003
  num_updates: 10
  gamma: 0.99
  n_steps: 64
  batch_size: 64
  n_epochs: 5
  log_std_init: -1.5
  entropy_coefficient: 0.0
  policy_num_layers: 2
  max_episode_steps: 250
  pregrasp_distance: 0.05
  control:
    mode: normalized_delta
    arm_delta_scale: 0.025
    gripper_delta_scale: 25.5
  stochastic: false
  exploration_noise: 0.1
  noise_scale: 0.1
  exports:
    rollout_report: ${artifacts.reports}/rl_grasp_rollout_report.jsonl
  reward:
    clip_min: -10.0
    clip_max: 10.0
    action_cost_weight: 0.01
    survival_bonus: 0.0
    contact_reward: 0.05
    bilateral_contact_reward: 2.0
    bilateral_hold_reward: 0.0
    contact_loss_penalty: 2.0
    distance_progress_weight: 10.0
    fingertip_progress_weight: 20.0
    lift_reward_weight: 20.0
    grasp_success_bonus: 10.0
    lift_height_threshold: ${metrics.lift_height_threshold}
    drop_height_threshold: 0.1
    terminate_on_non_finite: true

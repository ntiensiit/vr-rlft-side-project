# @package _global_
rl:
  observation_dim: 31
  action_dim: 8
  hidden_dim: 32
  checkpoint: ${artifacts.checkpoints}/rl_grasp_policy.pt
  tensorboard: ${artifacts.tensorboard}/rl_grasp_train
  learning_rate: 0.0003
  num_updates: 10
  clip_ratio: 0.2
  entropy_coefficient: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  n_steps: 64
  batch_size: 64
  n_epochs: 1
  policy_num_layers: 2
  exports:
    rollout_report: ${artifacts.reports}/rl_grasp_rollout_report.jsonl
  reward:
    action_cost_weight: 0.01
    survival_bonus: 1.0
    contact_reward: 0.5
    lift_reward_weight: 2.0
    grasp_success_bonus: 5.0
    lift_height_threshold: ${metrics.lift_height_threshold}
    drop_height_threshold: 0.1
    terminate_on_non_finite: true

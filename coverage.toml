[run]
branch = false
source = ["src"]
omit = [
    "tests/*",
    # CLI and end-to-end orchestration are exercised by integration workflows,
    # not by the fast unit-test suite used for this coverage gate.
    "src/grasping_ai/pipelines/prepare_observations.py",
    "src/grasping_ai/pipelines/prepare_synthetic_data.py",
    "src/grasping_ai/pipelines/simulate_grasp.py",
    "src/grasping_ai/pipelines/supervised_training.py",
    "src/grasping_ai/pipelines/supervised_training_script.py",
    "src/grasping_ai/pipelines/synthetic_audit.py",
    "src/grasping_ai/pipelines/train_diffusion.py",
    "src/grasping_ai/pipelines/train_flow.py",
    "src/grasping_ai/pipelines/train_rl.py",
    "src/grasping_ai/pipelines/visualize_robot.py",
    "src/grasping_ai/inference/grasp_inference_runtime.py",
]

[report]
show_missing = true
skip_covered = false
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
